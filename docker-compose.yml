services:
  # 1. PostgreSQL with pgvector for MediSlot & AI Assistant
  postgres:
    image: pgvector/pgvector:pg16
    container_name: medislot-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-medislot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis for BullMQ Background Job Queue (Notifications & Reminders)
  redis:
    image: redis:7-alpine
    container_name: medislot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Express Node.js Backend API
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: medislot-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. React Vite Frontend
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: medislot-client
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api

  # 5. Python FastAPI Clinical AI Copilot Microservice
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: medislot-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - AI_SERVICE_HOST=0.0.0.0
      - AI_SERVICE_PORT=8000
      - AI_SERVICE_SECRET=${AI_SERVICE_SECRET:-medislot-internal-ai-secret-2026}
      - AI_PROVIDER=${AI_PROVIDER:-deterministic_local}


volumes:
  postgres_data:
  redis_data:
